# Continuous integration (Phase 24 step 1, docs/design/PHASE_SPECS.md §24.1).
#
# Linux: the portable engine, editor UI, scripting and tests with GCC,
# Clang, ASan/UBSan and the physics module; runs unit, functional, checked-in
# fuzz-corpus and registered API/release-gate regressions, and keeps JUnit.
#
# macOS (Apple Silicon): the engine, scripting, physics, the Vulkan backend
# on MoltenVK and the editor shell; runs unit, functional and registered regressions.
#
# Windows: MSVC builds the engine, D3D12 editor, and Qt editor spike, runs
# their tests and registered regressions, and packages the production Qt editor (aether_editor.exe, its
# DLLs and assets) as a downloadable artifact. Pushing a tag v* - or running
# the workflow by hand with a release_tag - also publishes the package as a
# GitHub release.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.24.0), created on the commit being built; empty for a plain run"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
            type: RelWithDebInfo
            flags: ""
            physics: "OFF"
          - name: Clang
            cc: clang
            cxx: clang++
            type: RelWithDebInfo
            flags: ""
            physics: "OFF"
          - name: ASan+UBSan
            cc: gcc
            cxx: g++
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            physics: "OFF"
          - name: Physics
            cc: gcc
            cxx: g++
            type: RelWithDebInfo
            flags: ""
            physics: "ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # The X11 development packages build GLFW's window backend; Xvfb gives
        # the window tests a display. The Vulkan loader and headers, glslang
        # (HLSL to SPIR-V) and Mesa's lavapipe (software Vulkan) let the
        # Vulkan backend build and its tests render on a runner with no GPU.
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build xvfb
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          libvulkan-dev glslang-dev glslang-tools spirv-tools mesa-vulkan-drivers
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ matrix.name }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-linux-${{ matrix.name }}-
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          -DAETHER_BUILD_PHYSICS=${{ matrix.physics }}
          -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_SANDBOX=OFF
          -DAETHER_PLATFORM_PLUGINS=platforms/example
      - name: Module graph
        # Phase 37 step 2: required architectural boundary check. The layer map
        # covers the union of first-party targets across supported configurations.
        if: matrix.name == 'GCC'
        run: |
          cmake --graphviz=build/graph.dot build
          python3 tools/check_module_graph.py --dot build/graph.dot
      - name: Build
        run: cmake --build build --parallel
      - name: Install the SDK and build its template consumer
        if: matrix.name == 'GCC'
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/build/sdk-install"
          cmake -S tools/sdk-template-consumer -B build/sdk-template-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/sdk-install"
          cmake --build build/sdk-template-consumer --parallel
          ./build/sdk-template-consumer/aether_template_sdk_consumer
      - name: Upload the installed SDK for clean-machine validation
        if: matrix.name == 'GCC'
        uses: actions/upload-artifact@v4
        with:
          name: aether-sdk-linux-x64
          path: build/sdk-install
          if-no-files-found: error
      - name: Unit tests
        env:
          # Under LeakSanitizer, Mesa's lavapipe reports allocations its
          # worker threads keep after the driver is unloaded; that job hides
          # the driver, so its Vulkan device tests skip (the others run them).
          VK_DRIVER_FILES: ${{ matrix.name == 'ASan+UBSan' && '/nonexistent/icd.json' || '' }}
          VK_ICD_FILENAMES: ${{ matrix.name == 'ASan+UBSan' && '/nonexistent/icd.json' || '' }}
        run: xvfb-run -a ./build/tests/aether_tests
      - name: Functional tests
        run: ./build/tools/functional/aether_functional --quiet --junit functional-results.xml
      - name: Registered regression tests
        run: ctest --test-dir build --output-on-failure --parallel 4 -R "^(fuzz_replay_.*|module_graph_catches_a_cycle|api_stability_annotations|api_freeze_checks|frozen_api_game|production_gate_table|m8_gate_table)$"
      - name: Long-running heap soak
        if: matrix.name == 'GCC'
        env:
          AETHER_SOAK_SCALE: "4"
        run: ctest --test-dir build --output-on-failure -R "^soak$"
      - name: Benchmarks
        # Phase 38 steps 1 and 6: retain a provenance-tagged report artifact, and compare with the checked-in
        # baseline (bench/baseline.json) by calibration-normalized time. Required since it held with no regression
        # on ten master runs in a row (2026-10-15 to 2026-10-22); docs/design/PERFORMANCE.md says how to refresh it.
        if: matrix.name == 'GCC'
        run: ./build/bench/aether_bench --repeat 5 --json bench-report.json --baseline bench/baseline.json --tolerance 3.0
      - name: Upload the benchmark report
        if: matrix.name == 'GCC' && always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: error
      - name: Pack the assets
        # Phase 25: assets/ into an .apak archive and back, byte for byte.
        if: matrix.name == 'GCC'
        run: |
          ./build/tools/pak/aether_pak create assets.apak assets --prefix assets
          ./build/tools/pak/aether_pak verify assets.apak
          ./build/tools/pak/aether_pak extract assets.apak unpacked
          diff -r assets unpacked/assets
      - name: Content pipeline evidence (M8.5)
        # Repeat cooks are byte-identical and reuse every import and texture; editing a file the models depend on
        # (the .bin buffer all 22 AETHER-01 models share, which is not an asset itself) re-imports exactly those models.
        if: matrix.name == 'GCC'
        run: |
          rm -rf m85 && mkdir m85 && cp -r games/AETHER-01 m85/project && rm -rf m85/project/Intermediate
          cook() { ./build/tools/cook/aether_cook m85/project/AETHER-01.aproject --out "m85/$1" --config development | tee "m85/$1.txt"; }
          cook first && cook repeat
          sha256sum m85/first/Game.apak m85/repeat/Game.apak
          [ "$(sha256sum < m85/first/Game.apak)" = "$(sha256sum < m85/repeat/Game.apak)" ]
          grep -E "^import cache: [0-9]+ reused, 0 imported$" m85/repeat.txt
          grep -E "^texture cache: [0-9]+ reused, 0 cooked$" m85/repeat.txt
          python3 -c "import struct,sys; f=open(sys.argv[1],'r+b'); x=struct.unpack('<f',f.read(4))[0]; f.seek(0); f.write(struct.pack('<f',x+0.5))" m85/project/Content/models/test_cube.bin
          cook edited
          models=$(grep -l '"test_cube.bin"' m85/project/Content/models/*.gltf | wc -l)
          echo "models that reference test_cube.bin: $models"
          grep -E "^import cache: [0-9]+ reused, $models imported$" m85/edited.txt
          grep -E "^texture cache: [0-9]+ reused, 0 cooked$" m85/edited.txt
          [ "$(sha256sum < m85/first/Game.apak)" != "$(sha256sum < m85/edited/Game.apak)" ]
      - name: Play AETHER-01 through Vulkan with the validation layer
        # The cooked game in the player under Xvfb, drawn through Vulkan on lavapipe with the Khronos validation layer:
        # any validation error fails the step. Windows plays it on D3D12; this is the scene path on Vulkan (Linux,
        # macOS, Android), which once compiled push constants into a uniform buffer the pipeline layout did not have.
        # Advisory for now: the scene renders on the Android emulator (SwiftShader), but lavapipe on this runner
        # segfaults inside its LLVM shader JIT on the scene pipeline. The step prints validation messages and a gdb
        # backtrace so that can be pinned down; make it required once it is clean.
        if: matrix.name == 'GCC'
        continue-on-error: true
        run: |
          sudo apt-get install -y vulkan-validationlayers gdb
          ./build/tools/cook/aether_cook games/AETHER-01/AETHER-01.aproject --out aether01-linux/Paks --config development
          status=0
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation xvfb-run -a ./build/player/aether_player \
            --pak aether01-linux/Paks --frames 30 --size 640x360 --user-dir aether01-linux/user \
            --screenshot aether01-linux.bmp > aether01-linux.log 2>&1 || status=$?
          echo "player exit status: $status"
          grep -E "Validation Error|VUID-" aether01-linux.log | sed 's/0x[0-9a-f]*/0x../g' | sort | uniq -c | head -20 || true
          if [ "$status" != 0 ]; then
            tail -20 aether01-linux.log
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation xvfb-run -a gdb -q -batch -ex run -ex "thread apply all bt 12" \
              --args ./build/player/aether_player --pak aether01-linux/Paks --frames 30 --size 640x360 \
              --user-dir aether01-linux/user 2>&1 | grep -E "^#|^Thread|SIG" | head -80 || true
            exit 1
          fi
          ! grep -q "Validation Error" aether01-linux.log
          test -s aether01-linux.bmp
      - name: Screenshot the editor shell
        # The portable editor (editor/shell) in a real window under Xvfb,
        # drawn through Vulkan on lavapipe; the last frame is kept.
        if: matrix.name == 'GCC'
        env:
          AETHER_EDITOR_MAX_FRAMES: "30"
          AETHER_EDITOR_SCREENSHOT: ${{ github.workspace }}/editor-screenshot-linux.png
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/editor/shell/aether_editor_shell
          test -s editor-screenshot-linux.png
      - name: Verify and record the editor screenshot
        if: matrix.name == 'GCC' && always()
        run: python3 tools/verify_editor_capture.py editor-screenshot-linux.png --platform linux-x64 --manifest editor-capture-linux.json
      - name: Upload the editor screenshot
        if: matrix.name == 'GCC' && always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot-linux
          path: |
            editor-screenshot-linux.png
            editor-capture-linux.json
          if-no-files-found: ignore
      - name: Keep the functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-results-linux-${{ matrix.name }}
          path: functional-results.xml
          if-no-files-found: ignore

  clean-machine-sdk:
    name: Clean-machine SDK consumer (Linux container)
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the installed SDK
        uses: actions/download-artifact@v4
        with:
          name: aether-sdk-linux-x64
          path: sdk-install
      - name: Build and run the consumer in a fresh container
        run: |
          docker build --tag aether-sdk-clean-machine tools/sdk-clean-machine
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/sdk-install:/opt/aether-sdk:ro" \
            --volume "$GITHUB_WORKSPACE/tools/sdk-template-consumer:/workspace:ro" \
            aether-sdk-clean-machine \
            sh -euxc 'cmake -S /workspace -B /tmp/consumer -G Ninja -DCMAKE_PREFIX_PATH=/opt/aether-sdk && cmake --build /tmp/consumer --parallel && /tmp/consumer/aether_template_sdk_consumer'

  macos:
    name: macOS (Apple Silicon, MoltenVK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # MoltenVK (Vulkan on Metal) with the Vulkan loader and headers, and
        # glslang for HLSL to SPIR-V.
        run: |
          brew install ninja molten-vk vulkan-loader vulkan-headers glslang
          for f in "$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix)/share/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" \
                   "$(brew --prefix molten-vk)/share/vulkan/icd.d/MoltenVK_icd.json"; do
            if [ -f "$f" ]; then echo "VK_ICD_FILENAMES=$f" >> "$GITHUB_ENV"; break; fi
          done
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-macos-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_PREFIX_PATH=$(brew --prefix)"
          -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_SANDBOX=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ./build/tests/aether_tests
      - name: Functional tests
        run: ./build/tools/functional/aether_functional --quiet --junit functional-results.xml
      - name: Registered regression tests
        run: ctest --test-dir build --output-on-failure --parallel 4 -R "^(fuzz_replay_.*|module_graph_catches_a_cycle|api_stability_annotations|api_freeze_checks|frozen_api_game|production_gate_table|m8_gate_table)$"
      - name: Screenshot the editor shell
        # Offscreen through MoltenVK; hosted runners may have no Metal
        # device, so this reports without failing the job.
        continue-on-error: true
        env:
          AETHER_EDITOR_HEADLESS: "1"
          AETHER_EDITOR_MAX_FRAMES: "10"
          AETHER_EDITOR_SCREENSHOT: ${{ github.workspace }}/editor-screenshot-macos.png
        run: ./build/editor/shell/aether_editor_shell
      - name: Verify and record the editor screenshot
        if: always()
        run: python3 tools/verify_editor_capture.py editor-screenshot-macos.png --platform macos-arm64 --manifest editor-capture-macos.json --optional
      - name: Upload the editor screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot-macos
          path: |
            editor-screenshot-macos.png
            editor-capture-macos.json
          if-no-files-found: ignore
      - name: Keep the functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-results-macos
          path: functional-results.xml
          if-no-files-found: ignore

  windows:
    name: Windows (MSVC, D3D12 editor)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-windows-
      - name: Configure
        # Vulkan is off: hosted runners have no Vulkan loader to link
        # against. The D3D12 editor and the rest build as usual.
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DAETHER_BUILD_VULKAN=OFF -DAETHER_BUILD_QT_EDITOR=ON
      - name: Module graph
        # Check the Windows editor and D3D12 target set against the same
        # cross-configuration layer map enforced by the Linux GCC job.
        run: |
          cmake --graphviz=build/graph.dot build
          python tools/check_module_graph.py --dot build/graph.dot
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        # The D3D12 backend falls back to WARP on hosts without a hardware GPU,
        # so the Windows suite is a required release check on hosted runners too.
        env:
          AETHER01_INPUT_TRACE: ${{ github.workspace }}/build/aether01-input-trace.json
        run: .\build\tests\Release\aether_tests.exe
      - name: Editor session soak
        run: .\build\editor\Release\aether_editor.exe --self-test --self-test-repeats 4
      - name: Functional tests
        run: .\build\tools\functional\Release\aether_functional.exe --quiet --junit functional-results.xml
      - name: Registered regression tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4 -R "^(fuzz_replay_.*|module_graph_catches_a_cycle|api_stability_annotations|api_freeze_checks|frozen_api_game|production_gate_table|m8_gate_table)$"
      - name: Long-running heap soak
        env:
          AETHER_SOAK_SCALE: "4"
        run: ctest --test-dir build -C Release --output-on-failure -R "^soak$"
      - name: Cook and launch the AETHER-01 proof project
        shell: pwsh
        run: |
          & .\build\tools\cook\Release\aether_cook.exe games\AETHER-01\AETHER-01.aproject --out build\aether01-cooked --config development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\build\player\Release\aether_player.exe --pak build\aether01-cooked\Game.apak --headless --frames 120 --report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify repeat cook and incremental texture cache
        shell: pwsh
        run: |
          $repeat = "build\aether01-cooked-repeat"
          $output = & .\build\tools\cook\Release\aether_cook.exe games\AETHER-01\AETHER-01.aproject --out $repeat --config development
          if ($LASTEXITCODE -ne 0) { throw "repeat AETHER-01 cook failed" }
          $summary = $output -join "`n"
          Write-Host $summary
          if ($summary -notmatch 'texture cache: ([1-9][0-9]*) reused, 0 cooked') {
            throw "repeat cook did not reuse the texture cache"
          }
          foreach ($file in @("Game.apak", "CookManifest.json")) {
            $first = (Get-FileHash "build\aether01-cooked\$file" -Algorithm SHA256).Hash
            $second = (Get-FileHash "$repeat\$file" -Algorithm SHA256).Hash
            if ($first -ne $second) { throw "repeat cook changed $file ($first != $second)" }
            Write-Host "$file SHA256 $first"
          }
      - name: Render the AETHER-01 proof scene
        shell: pwsh
        run: |
          $renderLog = & .\build\player\Release\aether_player.exe --pak build\aether01-cooked\Game.apak --frames 10 --size 960x540 --user-dir build\aether01-user 2>&1
          $renderExitCode = $LASTEXITCODE
          $renderLog | Write-Output
          $usesWarp = $renderLog -match 'Selected adapter: Microsoft Basic Render Driver|falling back to WARP'
          if ($usesWarp) {
            if ($renderExitCode -ne 0) {
              Write-Warning 'The hosted Microsoft Basic Render Driver could not complete the visual proof render. The hardware render is validated on developer GPUs; packaged headless gameplay validation will still run.'
              exit 0
            }
            Write-Warning 'The D3D12 frame submission smoke passed on WARP. This software adapter cannot provide the color-accurate proof capture; hardware GPU capture is verified on developer machines.'
          } else {
            if ($renderExitCode -ne 0) { exit $renderExitCode }
            & .\build\player\Release\aether_player.exe --pak build\aether01-cooked\Game.apak --frames 10 --size 960x540 --screenshot build\aether01-proof.bmp --user-dir build\aether01-user
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools\verify_aether01_capture.py build\aether01-proof.bmp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload the AETHER-01 rendered proof frame
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-01-rendered-proof
          path: build/aether01-proof-*.bmp
          if-no-files-found: ignore
      - name: Package the editor
        shell: pwsh
        run: |
          $out = "dist/AetherEditor"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # The Qt host is the current Windows editor UI. Keep the established
          # ImGui host beside it for tools that have not migrated yet.
          $qtEditor = Join-Path $out "AetherEditor.exe"
          Copy-Item build/editor/Release/aether_editor.exe $qtEditor
          $qtDeploy = Get-Command windeployqt.exe -ErrorAction Stop
          & $qtDeploy.Source --release --no-translations $qtEditor
          if ($LASTEXITCODE -ne 0) { throw "Deploying the Qt editor runtime failed" }
          Copy-Item build/editor/Release/aether_editor_legacy.exe (Join-Path $out "AetherEditorLegacy.exe")
          # The build tools and the player: cook a project, pack it, play it.
          Copy-Item build/tools/cook/Release/aether_cook.exe $out/
          Copy-Item build/tools/pak/Release/aether_pak.exe $out/
          Copy-Item build/player/Release/aether_player.exe $out/
          # The manual, and the API reference generated from the engine's reflection.
          Copy-Item -Recurse docs/manual $out/manual
          & build/tools/docgen/Release/aether_docgen.exe --out $out/api
          if ($LASTEXITCODE -ne 0) { throw "aether_docgen failed" }
          Get-ChildItem build/editor/Release -Filter *.dll | Copy-Item -Destination $out/
          Set-Content -Path (Join-Path $out "EDITOR_README.txt") -Value @(
            "Launch AetherEditor.exe for the current Qt-based Windows editor UI."
            "Use AetherEditorLegacy.exe for tools that have not migrated yet."
          ) -Encoding utf8
          Copy-Item -Recurse assets $out/assets
          Copy-Item README.md $out/
          Copy-Item THIRD_PARTY_NOTICES.md $out/
          Copy-Item docs/WINDOWS_REQUIREMENTS.md $out/
          $versionSource = Get-Content engine/include/aether/core/version.h -Raw
          if ($versionSource -notmatch 'kEngineVersion\s*=\s*"([^"]+)"') { throw 'Cannot read the engine release version' }
          Copy-Item ("docs/releases/v" + $matches[1] + '.md') $out/RELEASE_NOTES.md
          Copy-Item -Recurse plugins $out/plugins
          Copy-Item -Recurse third_party/licenses $out/licenses
          Compress-Archive -Path "$out/*" -DestinationPath dist/AetherEditor-windows-x64.zip -Force
      - name: Upload the editor
        uses: actions/upload-artifact@v4
        with:
          name: AetherEditor-windows-x64
          path: dist/AetherEditor-windows-x64.zip
      - name: Package and validate the standalone proof game
        shell: pwsh
        run: |
          & tools/package_aether01.ps1 -Configuration Release -Version '${{ inputs.release_tag || github.ref_name }}'
          Expand-Archive dist/AETHER-01-windows-x64.zip -DestinationPath build/package-check/AETHER-01
          $gameDir = (Resolve-Path build/package-check/AETHER-01).Path
          foreach ($line in Get-Content "$gameDir/SHA256SUMS.txt") {
            $expected = $line.Substring(0, 64)
            $file = Join-Path $gameDir $line.Substring(66)
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Package checksum mismatch: $file" }
          }
          # Remove the game source from its original location before launching.
          $source = (Resolve-Path games/AETHER-01).Path
          $hidden = Join-Path $env:GITHUB_WORKSPACE 'build/package-check/source-hidden'
          if (-not $source.StartsWith($env:GITHUB_WORKSPACE + '\') -or -not $hidden.StartsWith($env:GITHUB_WORKSPACE + '\')) { throw 'Unexpected source paths' }
          Move-Item -LiteralPath $source -Destination $hidden
          $pluginSource = (Resolve-Path plugins).Path
          $pluginHidden = Join-Path $env:GITHUB_WORKSPACE 'build/package-check/plugins-hidden'
          if (-not $pluginSource.StartsWith($env:GITHUB_WORKSPACE + '\') -or -not $pluginHidden.StartsWith($env:GITHUB_WORKSPACE + '\')) { throw 'Unexpected plugin source paths' }
          Move-Item -LiteralPath $pluginSource -Destination $pluginHidden
          Expand-Archive dist/AetherEditor-windows-x64.zip -DestinationPath build/package-check/Engine
          $engineDir = (Resolve-Path build/package-check/Engine).Path
          if ((Get-FileHash "$engineDir/aether_player.exe").Hash -ne (Get-FileHash "$gameDir/AETHER-01.exe").Hash) { throw 'Game player differs from packaged engine' }
          & "$engineDir/aether_cook.exe" "$hidden/AETHER-01.aproject" --out build/package-check/recooked --config development
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine cook failed' }
          if ((Get-FileHash build/package-check/recooked/Game.apak).Hash -ne (Get-FileHash "$gameDir/Paks/Game.apak").Hash) { throw 'Packaged engine recook differs from the original package' }
          New-Item -ItemType Directory -Force build/package-check/empty-cwd | Out-Null
          $capture = Join-Path $env:GITHUB_WORKSPACE 'build/aether01-packaged.bmp'
          $menu = Join-Path $env:GITHUB_WORKSPACE 'build/aether01-menu.bmp'
          $ending = Join-Path $env:GITHUB_WORKSPACE 'build/aether01-ending.bmp'
          $trace = Join-Path $env:GITHUB_WORKSPACE 'build/aether01-input-trace.json'
          Push-Location build/package-check/empty-cwd
          try {
            & "$gameDir/AETHER-01.exe" --headless --frames 120 --report --user-dir user
            if ($LASTEXITCODE -ne 0) { throw 'Packaged headless launch failed' }
            $renderProbe = & "$gameDir/AETHER-01.exe" --frames 10 --size 960x540 --user-dir user/render-probe 2>&1
            $renderProbeExitCode = $LASTEXITCODE
            $renderProbe | Write-Output
            $usesWarp = $renderProbe -match 'Selected adapter: Microsoft Basic Render Driver|falling back to WARP'
            if ($usesWarp) {
              if ($renderProbeExitCode -ne 0) {
                Write-Warning 'The hosted Microsoft Basic Render Driver could not complete the packaged visual probe. Packaged headless gameplay validation will continue; pixel captures require a hardware adapter.'
              } else {
                Write-Warning 'WARP completed the packaged D3D12 frame loop; pixel readback checks require a hardware adapter.'
              }
            } else {
              if ($renderProbeExitCode -ne 0) { throw 'Packaged D3D12 frame submission failed' }
              & "$gameDir/AETHER-01.exe" --frames 10 --size 960x540 --screenshot $capture --user-dir user
              if ($LASTEXITCODE -ne 0) { throw 'Packaged rendering failed' }
              & "$gameDir/AETHER-01.exe" --frames 10 --size 960x540 --press Escape --screenshot $menu --user-dir user
              if ($LASTEXITCODE -ne 0) { throw 'Packaged pause menu failed' }
            }
          $playthroughModes = @('headless')
          if (-not $usesWarp) { $playthroughModes += 'rendered' }
          foreach ($mode in $playthroughModes) {
              $replayArgs = @('--replay-input', $trace, '--report', '--user-dir', "user/replay-$mode")
              if ($mode -eq 'headless') { $replayArgs += '--headless' }
              elseif (-not $usesWarp) { $replayArgs += @('--size', '960x540', '--screenshot', $ending) }
              $result = & "$gameDir/AETHER-01.exe" @replayArgs
              $code = $LASTEXITCODE
              $result | Set-Content (Join-Path $env:GITHUB_WORKSPACE "build/aether01-playthrough-$mode.log")
              $result | Write-Output
              if ($code -ne 0) { throw "Packaged $mode playthrough failed" }
              $state = $result | Where-Object { $_ -like 'Player attributes: *' } | Select-Object -Last 1
              if (-not $state) { throw 'Missing final game state' }
              $state = $state.Substring('Player attributes: '.Length) | ConvertFrom-Json
              if ($state.MissionStage -ne 5 -or $state.Health -le 0 -or $state.ArchiveTime -ne 8) { throw 'Packaged playthrough did not complete the archive ending' }
            }
          } finally { Pop-Location }
          if (-not $usesWarp) {
            python tools/verify_aether01_capture.py $capture
            if ($LASTEXITCODE -ne 0) { throw 'Packaged scene pixels failed' }
            python tools/verify_aether01_capture.py --menu $menu
            if ($LASTEXITCODE -ne 0) { throw 'Packaged menu pixels failed' }
            python tools/verify_aether01_capture.py --ending $ending
            if ($LASTEXITCODE -ne 0) { throw 'Packaged ending pixels failed' }
          }
          $inventory = foreach ($path in @('dist/AetherEditor-windows-x64.zip', 'dist/AETHER-01-windows-x64.zip')) {
            $file = Get-Item $path
            [ordered]@{ name = $file.Name; bytes = $file.Length; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $captureStatus = if ($usesWarp -and $renderProbeExitCode -ne 0) { 'headless package validation passed; hosted software adapter could not produce a visual capture' } elseif ($usesWarp) { 'WARP frame submission passed; pixel captures require a hardware adapter' } else { 'validated' }
          $manifest = [ordered]@{ commit = '${{ github.sha }}'; platform = 'windows-x64'; configuration = 'Release'; signed = $false; visualCapture = $captureStatus; artifacts = @($inventory) }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/RELEASE_MANIFEST.json -Encoding utf8
          $inventory | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Upload the standalone proof game
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-01-windows-x64
          path: dist/AETHER-01-windows-x64.zip
          if-no-files-found: error
      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: Aether-release-evidence
          path: |
            dist/RELEASE_MANIFEST.json
            dist/SHA256SUMS.txt
            build/aether01-packaged.bmp
            build/aether01-menu.bmp
            build/aether01-ending.bmp
            build/aether01-input-trace.json
            build/aether01-playthrough-*.log
          if-no-files-found: ignore
      - name: Screenshot the packaged legacy editor fallback
        # The legacy host currently provides frame-limited capture hooks.
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          AETHER_EDITOR_MAX_FRAMES: "120"
          AETHER_EDITOR_SCREENSHOT: ${{ github.workspace }}/editor-screenshot.png
        run: |
          Expand-Archive dist/AetherEditor-windows-x64.zip -DestinationPath run -Force
          Push-Location run
          ./AetherEditorLegacy.exe
          Pop-Location
          if (-not (Test-Path editor-screenshot.png)) { throw "the editor wrote no screenshot" }
      - name: Verify and record the editor screenshot
        if: always()
        run: python tools/verify_editor_capture.py editor-screenshot.png --platform windows-x64 --manifest editor-capture-windows.json --optional
      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot-windows
          path: |
            editor-screenshot.png
            editor-capture-windows.json
          if-no-files-found: ignore
      - name: Keep the functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-results-windows
          path: functional-results.xml
          if-no-files-found: ignore

  windows-package-validation:
    name: Windows packaged editor (clean runner)
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download the packaged editor
        uses: actions/download-artifact@v4
        with:
          name: AetherEditor-windows-x64
          path: artifact
      - name: Extract and launch without the source checkout
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'AetherEditor-package'
          $emptyWorkingDirectory = Join-Path $env:RUNNER_TEMP 'AetherEditor-empty-cwd'
          New-Item -ItemType Directory -Force -Path $packageRoot, $emptyWorkingDirectory | Out-Null
          Expand-Archive artifact/AetherEditor-windows-x64.zip -DestinationPath $packageRoot -Force
          $editor = Join-Path $packageRoot 'AetherEditor.exe'
          if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) { throw 'Packaged AetherEditor.exe is missing' }
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $stdout = Join-Path $env:RUNNER_TEMP 'AetherEditor-self-test.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'AetherEditor-self-test.stderr.log'
          Push-Location $emptyWorkingDirectory
          $selfTest = $null
          try {
            $selfTest = Start-Process -FilePath $editor -ArgumentList '--self-test' -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden
            if (-not $selfTest.WaitForExit(120000)) {
              Stop-Process -Id $selfTest.Id -Force -ErrorAction SilentlyContinue
              $selfTest.WaitForExit()
              $output = Get-Content $stdout -Raw -ErrorAction SilentlyContinue
              $errors = Get-Content $stderr -Raw -ErrorAction SilentlyContinue
              throw "Packaged Qt editor self-test timed out after 120 seconds. stdout: $output`nstderr: $errors"
            }
            $selfTest.WaitForExit()
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($selfTest.ExitCode -ne 0) { throw "Packaged Qt editor self-test failed with exit code $($selfTest.ExitCode)" }
          } finally {
            if ($selfTest -and -not $selfTest.HasExited) { Stop-Process -Id $selfTest.Id -Force -ErrorAction SilentlyContinue }
            Pop-Location
            $env:PATH = $originalPath
          }

  windows-sign-release:
    name: Windows Authenticode release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, windows-package-validation]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download the Windows packages
        uses: actions/download-artifact@v4
        with:
          name: AetherEditor-windows-x64
          path: release-input/editor
      - uses: actions/download-artifact@v4
        with:
          name: AETHER-01-windows-x64
          path: release-input/game
      - uses: actions/download-artifact@v4
        with:
          name: Aether-release-evidence
          path: release-input/evidence
      - name: Sign and prepare release assets
        shell: pwsh
        env:
          AETHER_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.AETHER_WINDOWS_SIGNING_PFX_BASE64 }}
          AETHER_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.AETHER_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          & tools/sign_windows_release.ps1 `
            -EditorZip release-input/editor/AetherEditor-windows-x64.zip `
            -GameZip release-input/game/AETHER-01-windows-x64.zip `
            -EvidenceDirectory release-input/evidence/dist `
            -OutputDirectory dist/release-assets
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: Aether-release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  # Phase 37 step 6 (docs/design/UPGRADE_PLAN.md): extra analysis gates. They are advisory
  # (continue-on-error) until they have been clean for a while, then they become required.
  tsan:
    name: Linux (TSan, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build xvfb
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          libvulkan-dev glslang-dev glslang-tools spirv-tools mesa-vulkan-drivers
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-tsan-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-linux-tsan-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          -DAETHER_BUILD_PHYSICS=OFF -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_SANDBOX=OFF
      - name: Build the tests
        run: cmake --build build --target aether_tests --parallel
      - name: Threaded tests under TSan
        env:
          AETHER_TEST_FILTER: JobSystem_,Audio_SpscQueue,Audio_ThreadedMixer,Net_,NetPlay_,Streaming_
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tools/tsan_suppressions.txt
        run: xvfb-run -a ./build/tests/aether_tests

  android:
    # Phase 45 step 3: build and package the arm64 native engine core through
    # Gradle/ExternalNativeBuild. This produces a debug-signed APK; release
    # signing remains opt-in through repository or local secret variables.
    # Required since it built clean on every master run; Android windowing and Vulkan are still missing.
    name: Android (arm64, Gradle APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Build debug APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aether-android-arm64-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-emulator:
    # Runs the app on an x86_64 emulator (KVM on the Linux runner): it plays Lantern Run on start and logs
    # "AETHER_SMOKE PASS" under the tag "Aether", then renders through the Vulkan RHI into its SurfaceView; the job
    # checks "AETHER_RENDER PRESENTED" and that a screenshot shows the clear colour. Required.
    name: Android (x86_64 emulator, Lantern Run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Cook AETHER-01 on the host
        # The scene-mode run below plays this cooked game; the APK carries it as assets/Paks/Game.apak.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DAETHER_BUILD_TESTS=OFF \
            -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_EDITOR_UI=OFF -DAETHER_BUILD_SANDBOX=OFF -DAETHER_BUILD_MCP=OFF \
            -DAETHER_BUILD_BENCH=OFF -DAETHER_BUILD_VULKAN=OFF -DAETHER_BUILD_WINDOWING=OFF
          cmake --build build-host --target aether_cook
          ./build-host/tools/cook/aether_cook games/AETHER-01/AETHER-01.aproject --out game-assets/Paks --config development
          ls -l game-assets/Paks
      - name: Build x86_64 debug APK
        working-directory: platforms/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug -Paether.abis=x86_64 "-Paether.assets=${{ github.workspace }}/game-assets"
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r platforms/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.aether.engine/.MainActivity
            for i in $(seq 1 90); do adb logcat -d -s Aether:* | grep -q AETHER_RENDER && break; sleep 1; done
            adb exec-out screencap > emulator-screen.raw
            adb logcat -d -s Aether:* Vulkan:* AndroidRuntime:E DEBUG:* | tee emulator-logcat.txt
            grep -q "AETHER_SMOKE PASS" emulator-logcat.txt
            grep -q "AETHER_RENDER PRESENTED" emulator-logcat.txt
            python3 tools/android/check_screen.py emulator-screen.raw
            adb shell wm size
            adb shell 'input swipe 160 330 160 330 6000 & sleep 3; screencap /data/local/tmp/pressed.raw; wait'
            adb pull /data/local/tmp/pressed.raw emulator-pressed.raw
            adb logcat -d -s Aether:* | tee emulator-input.txt
            grep -q "AETHER_INPUT DOWN" emulator-input.txt
            python3 tools/android/check_screen.py emulator-pressed.raw --pressed
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell am start -W -n com.aether.engine/.MainActivity
            for i in $(seq 1 60); do [ "$(adb logcat -d -s Aether:* | grep -c 'AETHER_RENDER PRESENTED')" -ge 2 ] && break; sleep 1; done
            adb logcat -d -s Aether:* | tee emulator-lifecycle.txt
            grep -q "AETHER_USER_DATA /data/" emulator-lifecycle.txt
            grep -q "AETHER_LIFECYCLE Suspend" emulator-lifecycle.txt
            [ "$(grep -c 'AETHER_LIFECYCLE Resume' emulator-lifecycle.txt)" -ge 2 ]
            [ "$(grep -c 'AETHER_RENDER PRESENTED' emulator-lifecycle.txt)" -ge 2 ]
            adb shell am force-stop com.aether.engine
            adb logcat -c
            sh -c 'adb logcat -s Aether:* AetherEngine:* AndroidRuntime:* DEBUG:* libc:* vulkan:* > emulator-scene-stream.txt 2>&1 &'
            adb shell am start -W -n com.aether.engine/.MainActivity --es mode scene
            timeout 150 sh -c 'until grep -q "AETHER_SCENE PRESENTED\|AETHER_SCENE FAIL" emulator-scene-stream.txt; do sleep 2; done' || { echo "no AETHER_SCENE result; device state: $(timeout 10 adb get-state 2>&1)"; cat emulator-scene-stream.txt; exit 1; }
            timeout 20 adb exec-out screencap > emulator-scene.raw
            cp emulator-scene-stream.txt emulator-scene.txt
            cat emulator-scene.txt
            grep -q "AETHER_SCENE LOADED" emulator-scene.txt
            grep -q "AETHER_SCENE PRESENTED" emulator-scene.txt
            python3 tools/android/check_screen.py emulator-scene.raw --scene
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-android-emulator-logcat
          path: |
            emulator-logcat.txt
            emulator-screen.raw
            emulator-input.txt
            emulator-lifecycle.txt
            emulator-scene.txt
            emulator-scene-stream.txt
            emulator-scene.raw
            emulator-pressed.raw
          if-no-files-found: ignore

  ios:
    # Phase 45 step 4: cross-compile and package the arm64 UIKit app shell
    # against the engine core. Signing and device execution remain out of scope.
    name: iOS (arm64, unsigned app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ios/_deps
          key: deps-ios-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-ios-
      - name: Configure iOS arm64 app
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DAETHER_BUILD_IOS_APP=ON
          -DAETHER_BUILD_TESTS=OFF -DAETHER_BUILD_MCP=OFF
          -DAETHER_BUILD_SANDBOX=OFF -DAETHER_BUILD_PHYSICS=OFF
          -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_EDITOR_UI=OFF
          -DAETHER_BUILD_VULKAN=OFF -DAETHER_BUILD_SCRIPTING=OFF
          -DAETHER_BUILD_WINDOWING=OFF -DAETHER_BUILD_BENCH=OFF
      - name: Build unsigned iOS app
        run: cmake --build build-ios --config Release --target aether_ios --parallel
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build-ios/Release-iphoneos/AetherEngine.app dist/AetherEngine-iphoneos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aether-ios-iphoneos-arm64
          path: dist/AetherEngine-iphoneos-arm64.zip
          if-no-files-found: error

  ios-simulator:
    # Runs the app on the iOS Simulator: it plays Lantern Run on start and prints "AETHER_SMOKE PASS" to stdout.
    # Required since it passed on every master run that got a runner.
    name: iOS (Simulator, Lantern Run)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ios-sim/_deps
          key: deps-ios-sim-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-ios-sim-
      - name: Configure iOS Simulator app
        run: >
          cmake -S . -B build-ios-sim -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DAETHER_BUILD_IOS_APP=ON
          -DAETHER_BUILD_TESTS=OFF -DAETHER_BUILD_MCP=OFF
          -DAETHER_BUILD_SANDBOX=OFF -DAETHER_BUILD_PHYSICS=OFF
          -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_EDITOR_UI=OFF
          -DAETHER_BUILD_VULKAN=OFF -DAETHER_BUILD_SCRIPTING=OFF
          -DAETHER_BUILD_WINDOWING=OFF -DAETHER_BUILD_BENCH=OFF
      - name: Build Simulator app
        run: cmake --build build-ios-sim --config Release --target aether_ios --parallel -- -sdk iphonesimulator
      - name: Run on the Simulator
        run: |
          app=build-ios-sim/Release-iphonesimulator/AetherEngine.app
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "device $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch --stdout="$PWD/simulator-stdout.txt" "$udid" com.aether.engine
          for i in $(seq 1 60); do grep -q AETHER_SMOKE simulator-stdout.txt 2>/dev/null && break; sleep 1; done
          cat simulator-stdout.txt || true
          xcrun simctl shutdown "$udid" || true
          grep -q "AETHER_SMOKE PASS" simulator-stdout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-ios-simulator-stdout
          path: simulator-stdout.txt
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy (changed files, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          libvulkan-dev glslang-dev glslang-tools spirv-tools
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-tidy-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-linux-tidy-
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DAETHER_BUILD_PHYSICS=OFF -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_SANDBOX=OFF
      - name: Tidy the changed files
        run: |
          files=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- '*.cpp' | grep -E '^(engine|gameplay|inventory|interaction|quests|save|loc)/' | grep -vE '/d3d12/|^engine/src/gfx/[^/]+\.cpp$|^engine/src/platform/window\.cpp$' || true) # the D3D12 backend, the gfx/ files on top of it and the Win32 window need Windows.h: they can't be tidied on Linux
          if [ -z "$files" ]; then echo "no engine or kit sources changed"; exit 0; fi
          clang-tidy -p build $files

  # Phase 47 steps 1-2 (docs/design/UPGRADE_PLAN.md): replay the checked-in corpus in every job and
  # run every available libFuzzer target for a bounded budget here. Advisory while fuzz coverage grows.
  fuzz:
    name: Fuzz (Clang, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          libvulkan-dev glslang-dev glslang-tools spirv-tools
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-fuzz-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: deps-linux-fuzz-
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAETHER_BUILD_FUZZERS=ON
          -DAETHER_BUILD_PHYSICS=OFF -DAETHER_BUILD_EDITOR=OFF -DAETHER_BUILD_SANDBOX=OFF -DAETHER_BUILD_TESTS=OFF
      - name: Build the fuzzers
        run: cmake --build build --target aether_fuzz_all --parallel
      - name: Fuzz
        run: |
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            mkdir -p work/$t
            cp -r tools/fuzz/corpus/$t/. work/$t/
            ./build/tools/fuzz/aether_fuzz_$t -max_total_time=15 -rss_limit_mb=2048 -timeout=10 work/$t
          done < build/fuzz-targets.txt
      - name: Keep any crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  release:
    name: Release
    # A pushed v* tag, or a manual run given a release_tag (which creates
    # the tag on the commit it built).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [linux, clean-machine-sdk, macos, windows, windows-package-validation, windows-sign-release, android, android-emulator, ios, ios-simulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write       # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Aether-release-assets
          path: release-assets
      - name: Check the archives against SHA256SUMS
        run: |
          for f in AetherEditor-windows-x64.zip AETHER-01-windows-x64.zip; do
            want=$(tr -d '\r\357\273\277' < release-assets/SHA256SUMS.txt | awk -v n="$f" '$2==n {print tolower($1)}')
            have=$(sha256sum "release-assets/$f" | cut -d' ' -f1)
            echo "$f want=$want have=$have"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then echo "::error::$f does not match SHA256SUMS.txt"; exit 1; fi
          done
      # Signed build provenance (Sigstore, keyless) complements optional Windows Authenticode signing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/AetherEditor-windows-x64.zip
            release-assets/AETHER-01-windows-x64.zip
            release-assets/RELEASE_MANIFEST.json
            release-assets/SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/AetherEditor-windows-x64.zip
            release-assets/AETHER-01-windows-x64.zip
            release-assets/RELEASE_MANIFEST.json
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          prerelease: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
