<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b181e">
  <meta name="description" content="Lanternwake — a little light against the dark. An original adventure made with Aether Engine.">
  <title>Lanternwake · Aether</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#071014;color:#f5ebce}
    body{font:13px system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
    main{position:relative;width:min(100vw,calc((100vh - 48px)*1.6));aspect-ratio:8/5;box-shadow:0 20px 100px #0009;background:#0b181e}
    canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
    #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#0b181e;z-index:2;transition:opacity .6s}
    #loading.hidden{opacity:0;pointer-events:none}.sigil{width:25px;height:25px;border:1px solid #e6bc70;transform:rotate(45deg);box-shadow:0 0 40px #e6bc7050;animation:breathe 2s ease-in-out infinite}
    @keyframes breathe{50%{box-shadow:0 0 50px #e6bc7080;opacity:.4}}
    #loading strong{font-family:Georgia,serif;font-size:32px;font-weight:400;letter-spacing:5px}
    #status{color:#97aba4;font-size:12px;letter-spacing:1px}
    footer{height:48px;width:min(100vw,calc((100vh - 48px)*1.6));display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;color:#7c928e;font-size:11px;letter-spacing:.3px}
    footer span{white-space:nowrap}button{font:inherit;color:#c4cdb9;border:1px solid #34423e;background:transparent;border-radius:4px;padding:5px 12px;cursor:pointer}button:hover,button:focus-visible{border-color:#e6bc70;color:#f5ebce}
    #error{max-width:500px;color:#f09e8a;white-space:pre-wrap;text-align:center;padding:16px;display:none}
    main:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;display:flex;align-items:center;justify-content:center;background:#071014}
    main:fullscreen canvas{width:min(100vw,160vh);height:min(62.5vw,100vh)}
    @media(max-width:600px){footer .extra{display:none}footer{font-size:10px}}
    @media(prefers-reduced-motion:reduce){.sigil{animation:none}}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="canvas" width="1280" height="800" tabindex="0" aria-label="Lanternwake game. WASD or arrows move. Space dashes. F pulses. Hold E beside a shrine. Enter starts. Escape pauses."></canvas>
    <div id="loading" role="status"><div class="sigil"></div><strong>LANTERNWAKE</strong><div id="status">Lighting the lantern…</div><div id="error"></div></div>
  </main>
  <footer><span>Made with Aether <span class="extra">· Native C++ / WebAssembly</span></span><span class="extra">WASD move · SPACE dash · F pulse · E offer · ESC pause</span><button id="fullscreen" type="button">Fullscreen ↗</button></footer>
  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    let started = false;
    function failure(message){
      started=false;
      loading.classList.remove('hidden');
      document.getElementById('status').textContent='The lantern could not be lit.';
      const error=document.getElementById('error'); error.style.display='block';
      error.textContent=String(message)+'\nPlease try a recent desktop browser with WebAssembly enabled.';
    }
    var Module = {
      canvas,
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
      setStatus: (text) => { if(text&&!started) document.getElementById('status').textContent=text; },
      onRuntimeInitialized: () => { document.getElementById('status').textContent='Preparing the grove…'; },
      onGameReady: () => {
        started=true;
        setTimeout(()=>{if(started){loading.classList.add('hidden');canvas.focus({preventScroll:true});}},100);
      },
      onGameFailure: failure,
      onAbort: failure
    };
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
    document.getElementById('fullscreen').addEventListener('click', async()=>{
      try{if(document.fullscreenElement) await document.exitFullscreen(); else await document.getElementById('game').requestFullscreen();}
      catch(error){console.warn(error);}
      canvas.focus({preventScroll:true});
    });
    window.addEventListener('keydown',event=>{
      if(event.target===canvas&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();
    });
    window.addEventListener('error',event=>{if(!started)failure(event.message);});
  </script>
  {{{ SCRIPT }}}
</body>
</html>
